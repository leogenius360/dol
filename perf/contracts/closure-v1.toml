  "heap_before",
  "heap_after_construct",
  "heap_after_cache_fill",
  "heap_after_drop",
  "peak_rss",
  "retained_heap",
  "alloc_blocks",
  "alloc_bytes",
  "bytes_per_node",
  "bytes_per_stage",
]

[closure_criteria]
prepared_evaluation_improvement_at_least = 0.30
warm_identity_improvement_at_least = 0.10
postgres_warm_improvement_at_least = 0.10
maximum_confirmed_cold_regression = 0.05
maximum_confirmed_collateral_regression = 0.05
wire_decode_allowed = ["neutral", "accepted", "fixed"]
dedicated_runner_evidence_required = true
baseline_ratification_required = true
