[workspace]
resolver = "3"
members = [
    "dol",
    "crates/dol-core",
    "crates/dol-macros",
    "crates/dol-engine",
    "crates/dol-migrate",
    "crates/dol-wire",
    "crates/dol-ml",
    "crates/dol-conformance",
    "engines/memory",
    "engines/postgres",
    "engines/mongodb",
    "engines/jsonl",
    "tools/benchmarks",
    "tools/xtask",
]
default-members = ["dol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "BSD-3-Clause"
authors = ["Dominic Maabobra Tuolong"]
repository = "https://github.com/leogenius360/dol"

[profile.bench]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
