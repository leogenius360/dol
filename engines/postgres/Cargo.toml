[package]
name = "dol-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PostgreSQL physical mapping, exact compiler, and bounded runtime for DOL"

[dependencies]
dol-core = { path = "../../crates/dol-core", version = "0.1.0" }
dol-engine = { path = "../../crates/dol-engine", version = "0.1.0" }
native-tls = "0.2.18"
postgres = { version = "0.19.14", features = ["with-time-0_3", "with-uuid-1"] }
postgres-native-tls = "0.5.3"
time = { version = "0.3", features = ["std"] }
uuid = { version = "1.18", features = ["std"] }

[dev-dependencies]
dol = { path = "../..", version = "0.1.0" }
dol-conformance = { path = "../../crates/dol-conformance", version = "0.1.0" }
dol-memory = { path = "../memory", version = "0.1.0" }
rust_decimal = { version = "1.37", default-features = false, features = ["std"] }

[lints]
workspace = true
