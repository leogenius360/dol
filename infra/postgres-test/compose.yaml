services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: dol-postgres-test:18.6
    environment:
      POSTGRES_DB: dol
      POSTGRES_USER: dol_admin
      POSTGRES_PASSWORD: dol-admin-test-only
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${DOL_POSTGRES_TEST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-tls:/var/lib/dol-postgres-test/tls
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD=dol-test-only psql
          'host=localhost port=5432 dbname=dol user=dol_test sslmode=require'
          -Atqc 'SELECT 1' | grep -qx 1
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

volumes:
  postgres-data:
  postgres-tls:
