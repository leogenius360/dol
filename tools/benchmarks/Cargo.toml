[package]
name = "dol-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reproducible repository-level benchmarks for DOL"
publish = false

[dependencies]
dol = { path = "../..", version = "0.1.0", features = ["derive"] }
dol-core = { path = "../../crates/dol-core", version = "0.1.0" }
